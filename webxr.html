<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>WebXR GLB Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #model-container { width: 100%; height: 100vh; position: relative; }
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 10px;
            z-index: 10;
        }
        #ar-button, #exit-ar-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        #exit-ar-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: auto;
            display: none;
            background: #f44336;
        }
        #ar-support-message {
            color: #ff9800;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
    <!-- Three.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="model-container"></div>
    <div class="ui-container">
        <h2 id="product-name">Loading Model...</h2>
        <p id="product-desc"></p>
        <button id="ar-button">Start AR</button>
        <p id="ar-support-message"></p>
    </div>
    <button id="exit-ar-button">Exit AR</button>
    <script src="webxr.js"></script>
</body>
</html>
