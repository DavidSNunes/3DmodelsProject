<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer with AR</title>

    <!-- Styling -->
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #model-container {
            flex: 1;
            position: relative;
        }

        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            z-index: 10;
            max-width: 90%;
        }

        .ui-container a, .ui-container button {
            display: block;
            margin-top: 10px;
            padding: 10px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }

        @media only screen and (max-width: 768px) {
            .ui-container {
                bottom: 10px;
                font-size: 14px;
                padding: 8px 16px;
            }

            .ui-container button {
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>

    <!-- Load ModelViewer -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body>
    <div id="model-container">
        <!-- 3D Model Viewer -->
        <model-viewer 
            id="viewer"
            alt="3D Model"
            src=""
            ar
            camera-controls
            shadow-intensity="1"
            auto-rotate
            style="width: 100%; height: 100%;">
        </model-viewer>

        <!-- UI Container -->
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button" style="display:none;">View in AR</button>
        </div>
    </div>

    <!-- Load the script -->
    <script>
        // Sample model data (this would usually come from a backend or URL params)
        const modelData = {
            name: "Audi A4",
            desc: "3D Model of an Audi A4",
            link: "https://www.audi.com/",
            file: "audi_a4.glb"
        };

        // Populate UI with model data
        document.getElementById('product-name').innerText = modelData.name;
        document.getElementById('product-desc').innerText = modelData.desc;
        document.getElementById('product-link').href = modelData.link;

        // Load the 3D model into viewer
        const modelViewer = document.getElementById('viewer');
        modelViewer.src = `https://3dmodelsproject.pages.dev/models/${modelData.file}`;

        // AR Button setup
        const arButton = document.getElementById('ar-button');

        // Check if WebXR AR is supported
        navigator.xr?.isSessionSupported('immersive-ar').then((supported) => {
            if (supported) {
                arButton.style.display = 'block';
                arButton.addEventListener('click', () => {
                    modelViewer.activateAR();
                });
            }
        });
    </script>
</body>
</html>
