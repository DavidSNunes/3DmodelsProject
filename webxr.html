<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/webxr/ARButton.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; text-align: center; }
        canvas { display: block; }
        #ui-container {
            position: absolute;
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 10px;
            border-radius: 10px;
        }
        #ui-container a {
            color: #00f; text-decoration: none; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <h2 id="product-name">Loading...</h2>
        <p id="product-desc"></p>
        <a id="product-link" href="#" target="_blank">View Product</a>
    </div>
    <script src="webxr.js"></script>
</body>
</html>
