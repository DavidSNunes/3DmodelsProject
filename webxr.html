<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
        }

        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 10; /* Ensure it's above the model */
            pointer-events: auto;
        }

        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }

        #ar-button {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 10; /* Ensure button is clickable */
            pointer-events: auto;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0; /* Ensure the canvas is under UI */
        }
    </style>

    <!-- Load Three.js and GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
    <div class="ui-container">
        <h2 id="product-name">Loading...</h2>
        <p id="product-desc">Please wait while we load your model.</p>
        <a id="product-link" href="#" target="_blank">View Product</a>
    </div>

    <!-- AR Button -->
    <button id="ar-button">Start AR</button>

    <!-- Load WebXR script -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
