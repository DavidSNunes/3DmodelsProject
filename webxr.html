<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR with WebXR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.2.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@1.0.0/dist/webxr-polyfill.min.js"></script>
  <script src="webxr.js"></script> <!-- Link to the JavaScript file -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #arButton {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    .ar-ui {
      position: absolute;
      top: 20%;
      left: 10%;
      z-index: 99;
      color: white;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>
  <button id="arButton">Enter AR</button>

  <div class="ar-ui">
    <h2>Product Name</h2>
    <p>This is a description of the product.</p>
    <a href="https://example.com" target="_blank">Learn More</a>
  </div>

  <a-scene id="arScene" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-entity id="model" position="0 0 0" scale="0.5 0.5 0.5"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
