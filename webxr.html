<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
        }

        .ui-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-bottom: 10px;
        }

        #product-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #product-desc {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #ddd;
        }

        #product-link, #ar-button {
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background-color: #4CAF50;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        #product-link:hover, #ar-button:hover {
            background-color: #3e8e41;
        }

        #ar-button {
            background-color: #007BFF;
        }

        #ar-button:hover {
            background-color: #0056b3;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>

    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
</head>

<body>
    <div class="ui-container">
        <h2 id="product-name">Loading...</h2>
        <h3 id="product-model">Loading model...</h3>
        <p id="product-desc">Please wait while we load your model.</p>
        <a id="product-link" href="#" target="_blank">View Product</a>
        <a id="ar-button" href="#">Launch AR</a>
    </div>

    <!-- Load webxr.js as an ES6 module -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
