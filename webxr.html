<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>WebXR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        #model-container {
            display: none;
            width: 100%;
            height: 70vh;
        }
        #model-viewer-container {
            width: 100%;
            height: 70vh;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        .ui-container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 8px;
        }
        .ui-container button {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        #product-name {
            font-size: 20px;
            margin: 0 0 8px 0;
        }
        #product-desc {
            font-size: 16px;
            line-height: 1.5;
            margin: 0 0 12px 0;
        }
        #exit-ar-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            padding: 10px 15px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .ar-tooltip {
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 1000;
            border-radius: 10px;
            margin: 0 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
        }

        @media only screen and (max-width: 600px) {
            .ui-container {
                padding: 12px;
            }
            #product-name {
                font-size: 18px;
            }
            #product-desc {
                font-size: 14px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/webxr/XRControllerModelFactory.js"></script>
</head>
<body>
    <div id="model-viewer-container">
        <model-viewer
            id="model-viewer"
            ar
            ar-modes="scene-viewer quick-look"
            src=""
            alt="3D model"
            auto-rotate
            camera-controls>
        </model-viewer>
    </div>
    
    <div class="ui-container">
        <h2 id="product-name">Loading...</h2>
        <p id="product-desc">Please wait while we load your model.</p>
        <a id="product-link" href="#" target="_blank">View Product Details</a>
        <button id="ar-button" style="display: none;">View in AR</button>
    </div>
    
    <div id="model-container">
        <!-- Three.js content will go here for WebXR AR mode -->
    </div>
    
    <button id="exit-ar-button">Exit AR</button>
    <div id="ar-tooltip" class="ar-tooltip">Tap to place the model</div>
    
    <script src="/webxr.js"></script>
</body>
</html>
