<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            height: 60vh; /* Reduce height of the model viewer */
        }
        .ui-container {
            position: absolute;
            bottom: 0; /* Stick to the bottom */
            left: 0;
            right: 0; /* Span the full width */
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 16px; /* Reduced padding */
            border-radius: 10px 10px 0 0; /* Rounded corners at the top */
            text-align: left;
            z-index: 10;
            max-height: 40vh; /* Limit height to avoid cutting off */
            overflow-y: auto; /* Allow scrolling if content overflows */
            box-sizing: border-box; /* Include padding in width/height */
        }
        .ui-container h2 {
            margin: 0 0 8px 0; /* Reduced margin */
            font-size: 16px; /* Smaller font size */
        }
        .ui-container p {
            margin: 0 0 8px 0; /* Reduced margin */
            font-size: 12px; /* Smaller font size */
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-bottom: 8px; /* Reduced margin */
            font-size: 12px; /* Smaller font size */
        }
        .ui-container button {
            display: block;
            width: 100%; /* Full width */
            padding: 8px 16px; /* Reduced padding */
            font-size: 14px; /* Smaller font size */
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px; /* Reduced margin */
        }

        /* Responsive Styles for Mobile Devices */
        @media only screen and (max-width: 768px) {
            #model-container {
                height: 50vh; /* Further reduce height for mobile */
            }
            .ui-container {
                padding: 6px 12px; /* Even smaller padding for mobile */
                max-height: 50vh; /* Allow more height for mobile */
            }
            .ui-container h2 {
                font-size: 14px; /* Smaller font size for mobile */
            }
            .ui-container p {
                font-size: 10px; /* Smaller font size for mobile */
            }
            .ui-container a {
                font-size: 10px; /* Smaller font size for mobile */
            }
            .ui-container button {
                font-size: 12px; /* Smaller font size for mobile */
                padding: 6px 12px; /* Smaller padding for mobile */
            }
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button">Start AR</button>
        </div>
    </div>
    <!-- Load webxr.js as an ES6 module -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
