<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .ui-container {
            position: absolute;
            bottom: 120px; /* Adjusted to make space for the AR button */
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: left;
            z-index: 10;
            max-width: 90%; /* Allow container to take more width */
            font-size: 14px; /* Smaller font size for mobile */
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
        #ar-button {
            position: fixed; /* Use fixed positioning for better control */
            bottom: 10px; /* Positioned at the bottom */
            left: 10px; /* Aligned with the model details container */
            right: 10px; /* Ensure it spans the width with margins */
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
            width: calc(100% - 20px); /* Make button full width with some margin */
            box-sizing: border-box; /* Ensure padding is included in width */
        }

        /* Responsive Styles for Mobile Devices */
        @media only screen and (max-width: 768px) {
            .ui-container {
                bottom: 140px; /* Move higher to make space for AR button */
                left: 10px;
                max-width: 90%;
                font-size: 14px;
                padding: 8px 16px;
            }
            #ar-button {
                bottom: 10px; /* Move closer to the bottom */
                left: 10px;
                right: 10px;
                padding: 10px 20px;
                font-size: 14px;
                width: calc(100% - 20px); /* Full width with margin */
            }
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <a id="product-link" href="#" target="_blank">View Product</a>
        </div>
        <button id="ar-button">Start AR</button>
    </div>
    <!-- Load webxr.js as an ES6 module -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
