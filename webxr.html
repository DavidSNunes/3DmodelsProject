<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: left;
            z-index: 10;
            max-width: 90%;
            font-size: 14px;
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
        .ui-container button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #ar-prompt {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            z-index: 100;
            display: none;
        }
        #ar-error {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: red;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            z-index: 100;
            display: none;
        }
        @media only screen and (max-width: 768px) {
            .ui-container {
                bottom: 10px;
                left: 10px;
                max-width: 90%;
                font-size: 14px;
                padding: 8px 16px;
            }
            .ui-container button {
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.js"></script>
</head>
<body>
    <div id="ar-prompt">Move your device to start AR experience</div>
    <div id="ar-error"></div>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button">Start AR</button>
        </div>
    </div>
    <script src="/webxr.js"></script>
</body>
</html>
