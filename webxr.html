<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .ui-container {
            position: absolute;
            bottom: 50px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            text-align: left;
            z-index: 10;
            max-width: calc(100% - 20px);
            font-size: 14px;
            max-height: 50vh;
            overflow-y: auto;
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 8px;
        }
        .ui-container button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            font-size: 15px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #loading-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin: 8px 0;
        }
        #loading-progress {
            width: 0%;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 5px;
            transition: width 0.3s;
        }
        #ar-support-message {
            color: #ff9800;
            margin-top: 10px;
            font-size: 14px;
        }
        #exit-ar-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            padding: 10px 15px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .ar-tooltip {
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 1000;
            border-radius: 10px;
            margin: 0 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/pmrem/PMREMGenerator.js"></script>
    <script>
        async function checkARSupport() {
            const arButton = document.getElementById('ar-button');
            const arMessage = document.getElementById('ar-support-message') || document.createElement('p');
            arMessage.id = 'ar-support-message';
            
            if (!navigator.xr) {
                arMessage.textContent = 'AR not available (WebXR not supported)';
                arButton.style.display = 'none';
                document.querySelector('.ui-container').appendChild(arMessage);
                return false;
            }

            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!supported) {
                    arMessage.textContent = 'AR not available (No ARCore/ARKit)';
                    arButton.style.display = 'none';
                } else {
                    // Additional iOS-specific check
                    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                        const isIOS13Plus = /OS 1[3-9]|OS [2-9]\d/.test(navigator.userAgent);
                        if (!isIOS13Plus) {
                            arMessage.textContent = 'Requires iOS 13+ for AR';
                            arButton.style.display = 'none';
                            return false;
                        }
                    }
                    arButton.style.display = 'block';
                    arMessage.textContent = 'AR available - Tap to start';
                    arMessage.style.color = '#4CAF50';
                }
                document.querySelector('.ui-container').appendChild(arMessage);
                return supported;
            } catch (error) {
                arMessage.textContent = 'AR check failed';
                arButton.style.display = 'none';
                document.querySelector('.ui-container').appendChild(arMessage);
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkARSupport();
            
            const desc = document.getElementById('product-desc');
            if (desc) {
                desc.addEventListener('click', function() {
                    this.classList.toggle('expanded');
                });
            }
        });
    </script>
</head>
<body>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <div id="loading-bar"><div id="loading-progress"></div></div>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button">Start AR</button>
            <p id="ar-support-message"></p>
        </div>
    </div>
    <button id="exit-ar-button">Exit AR</button>
    <div id="ar-tooltip">Tap to place, then tap and hold to move</div>
    <script src="/webxr.js"></script>
</body>
</html>
