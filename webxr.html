<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 20px;
        }
        #product-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        #model-container {
            width: 100%;
            height: 400px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        #product-desc {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
        }
        #product-link {
            font-size: 16px;
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
            display: inline-block;
        }
        #ar-button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .error-message {
            color: red;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <div class="container">
        <!-- Product Name -->
        <h1 id="product-name">Loading...</h1>

        <!-- Model Container -->
        <div id="model-container"></div>

        <!-- Product Description -->
        <p id="product-desc">Please wait while we load your model.</p>

        <!-- Product Link -->
        <a id="product-link" href="#" target="_blank">View Product</a>

        <!-- AR Button -->
        <button id="ar-button">Start AR</button>
    </div>

    <!-- Error Message -->
    <p id="errorMessage" class="error-message" style="display: none;">Model not found.</p>

    <!-- Load webxr.js -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
