<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: left;
            z-index: 10;
            max-width: 90%;
            font-size: 14px;
            overflow: auto;
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }
        .ui-container button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #loading-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 10px;
        }
        #loading-progress {
            width: 0%;
            height: 10px;
            background-color: #4CAF50;
            border-radius: 5px;
        }

        @media only screen and (max-width: 768px) {
            .ui-container {
                bottom: 10px;
                left: 10px;
                max-width: 90%;
                font-size: 14px;
                padding: 8px 16px;
                height: auto;
                max-height: 40vh;
            }
            .ui-container button {
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>
    <!-- Three.js and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/pmrem/PMREMGenerator.js"></script>
    
    <script>
        // AR availability check
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
                if (!supported) {
                    const arButton = document.getElementById('ar-button');
                    if (arButton) {
                        arButton.style.display = 'none';
                        const arMessage = document.createElement('p');
                        arMessage.textContent = 'AR not available on this device';
                        arMessage.style.color = '#ff9800';
                        document.querySelector('.ui-container').appendChild(arMessage);
                    }
                }
            });
        } else {
            const arButton = document.getElementById('ar-button');
            if (arButton) arButton.style.display = 'none';
        }
    </script>
</head>
<body>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <div id="loading-bar"><div id="loading-progress"></div></div>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button">Start AR</button>
        </div>
    </div>
    <script src="/webxr.js"></script>
</body>
</html>
