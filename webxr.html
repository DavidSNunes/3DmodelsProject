<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebXR AR Experience</title>

    <!-- CSS (inlined) -->
    <style>
        /* Ensure page fits the screen on mobile */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Center content */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
        }

        /* AR button styling */
        .ar-button-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .ar-button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        /* Button hover effect */
        .ar-button:hover {
            background-color: #005A8D;
        }

        /* Mobile responsiveness */
        @media (max-width: 600px) {
            .ar-button {
                padding: 12px 25px;
                font-size: 16px;
            }

            .container h1 {
                font-size: 22px;
            }

            .container p {
                font-size: 16px;
            }

            .ar-button-container {
                bottom: 15px;
            }
        }
    </style>
</head>

<body>
    <!-- Main Content -->
    <div class="container">
        <h1>3D Model Viewer</h1>
        <p>Scan the QR code or click the button to view this model in AR.</p>
    </div>

    <!-- AR Button -->
    <div class="ar-button-container">
        <button class="ar-button" id="ar-button">Start AR</button>
    </div>

    <!-- JavaScript (inlined) -->
    <script>
        document.getElementById('ar-button').addEventListener('click', async () => {
            console.log('AR button clicked. Attempting to launch AR...');

            if ('xr' in navigator) {
                try {
                    const session = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test']
                    });

                    console.log('WebXR session started:', session);

                    alert('AR session started!');  // Temporary feedback for now

                    session.addEventListener('end', () => {
                        console.log('AR session ended.');
                    });
                } catch (err) {
                    console.error('Failed to start AR session:', err);
                    alert('Failed to start AR: ' + err.message);
                }
            } else {
                console.log('WebXR not supported on this device.');
                alert('Your browser does not support WebXR!');
            }
        });
    </script>
</body>
</html>
