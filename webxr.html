<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>WebXR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #model-viewer-container {
            display: none;
            width: 100%;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            bottom: 50px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            text-align: left;
            z-index: 10;
            max-width: calc(100% - 20px);
            font-size: 14px;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
            box-shadow: 0 -5px 10px rgba(0,0,0,0.2);
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 8px;
        }
        .ui-container button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            font-size: 15px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #loading-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin: 8px 0;
        }
        #loading-progress {
            width: 0%;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 5px;
            transition: width 0.3s;
        }
        #product-name {
            font-size: 18px;
            margin: 0 0 6px 0;
        }
        #product-desc {
            font-size: 14px;
            line-height: 1.4;
            margin: 0 0 8px 0;
            max-height: 4.2em;
            overflow: hidden;
            transition: max-height 0.3s;
        }
        #product-desc.expanded {
            max-height: none;
        }
        #exit-ar-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            padding: 10px 15px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .ar-tooltip {
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 1000;
            transition: opacity 0.3s;
            border-radius: 10px;
            margin: 0 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: none;
        }
        #fallback-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }

        /* Small mobile devices */
        @media only screen and (max-width: 375px) {
            .ui-container {
                padding: 10px 12px;
                max-height: 55vh;
                font-size: 13px;
            }
            #product-name {
                font-size: 16px;
            }
            #product-desc {
                font-size: 13px;
                max-height: 3.6em;
            }
            .ui-container button {
                padding: 8px 12px;
                font-size: 14px;
            }
        }
    </style>
    <!-- Three.js and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/pmrem/PMREMGenerator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/webxr/XRControllerModelFactory.js"></script>
</head>
<body>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <div id="loading-bar"><div id="loading-progress"></div></div>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button">Start AR</button>
            <p id="ar-support-message"></p>
        </div>
    </div>
    
    <div id="model-viewer-container">
        <model-viewer
            id="model-viewer"
            ar
            ar-modes="scene-viewer quick-look"
            src=""
            alt="3D model"
            auto-rotate
            camera-controls>
        </model-viewer>
    </div>
    
    <div id="fallback-message">
        <p>Advanced AR features not available</p>
        <button id="basic-view">View in Basic 3D</button>
    </div>
    
    <button id="exit-ar-button">Exit AR</button>
    <div id="ar-tooltip" class="ar-tooltip">Tap to place, then tap and hold to move</div>
    
    <script src="/webxr.js"></script>
</body>
</html>
