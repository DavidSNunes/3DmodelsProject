<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #model-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .ui-container {
            position: absolute;
            bottom: 50px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            text-align: left;
            z-index: 10;
            max-width: calc(100% - 20px);
            font-size: 14px;
            max-height: 50vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-sizing: border-box;
            box-shadow: 0 -5px 10px rgba(0,0,0,0.2);
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
            display: block;
            margin-top: 8px;
        }
        .ui-container button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            font-size: 15px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        #loading-bar {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin: 8px 0;
        }
        #loading-progress {
            width: 0%;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 5px;
            transition: width 0.3s;
        }
        #product-name {
            font-size: 18px;
            margin: 0 0 6px 0;
        }
        #product-desc {
            font-size: 14px;
            line-height: 1.4;
            margin: 0 0 8px 0;
            max-height: 4.2em;
            overflow: hidden;
            transition: max-height 0.3s;
        }
        #product-desc.expanded {
            max-height: none;
        }
        #exit-ar-button {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            padding: 10px 15px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .ar-tooltip {
            position: fixed;
            bottom: 100px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            z-index: 1000;
            transition: opacity 0.3s;
            border-radius: 10px;
            margin: 0 20px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        /* Small mobile devices */
        @media only screen and (max-width: 375px) {
            .ui-container {
                padding: 10px 12px;
                max-height: 55vh;
                font-size: 13px;
            }
            #product-name {
                font-size: 16px;
            }
            #product-desc {
                font-size: 13px;
                max-height: 3.6em;
            }
            .ui-container button {
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        /* Larger mobile devices */
        @media only screen and (min-width: 376px) and (max-width: 768px) {
            .ui-container {
                max-height: 45vh;
            }
        }
    </style>
    <!-- Three.js and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/pmrem/PMREMGenerator.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/webxr/XRControllerModelFactory.js"></script>
    
    <script>
        // Check for WebXR support
        async function checkXRSupport() {
            if (!navigator.xr) {
                console.log('WebXR not supported');
                const arButton = document.getElementById('ar-button');
                if (arButton) {
                    arButton.style.display = 'none';
                    const arMessage = document.createElement('p');
                    arMessage.textContent = 'AR not available on this device';
                    arMessage.style.color = '#ff9800';
                    document.querySelector('.ui-container').appendChild(arMessage);
                }
                return false;
            }

            try {
                const supported = await navigator.xr.isSessionSupported('immersive-ar');
                if (!supported) {
                    const arButton = document.getElementById('ar-button');
                    if (arButton) {
                        arButton.style.display = 'none';
                        const arMessage = document.createElement('p');
                        arMessage.textContent = 'AR not available on this device';
                        arMessage.style.color = '#ff9800';
                        document.querySelector('.ui-container').appendChild(arMessage);
                    }
                }
                return supported;
            } catch (error) {
                console.error('Error checking XR support:', error);
                return false;
            }
        }

        // Toggle description expansion
        document.addEventListener('DOMContentLoaded', function() {
            const desc = document.getElementById('product-desc');
            if (desc) {
                desc.addEventListener('click', function() {
                    this.classList.toggle('expanded');
                });
            }
            
            // Check XR support when page loads
            checkXRSupport();
        });
    </script>
</head>
<body>
    <div id="model-container">
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <div id="loading-bar"><div id="loading-progress"></div></div>
            <a id="product-link" href="#" target="_blank">View Product</a>
            <button id="ar-button">Start AR</button>
        </div>
    </div>
    <button id="exit-ar-button">Exit AR</button>
    <script src="/webxr.js"></script>
    <div id="ar-tooltip" class="ar-tooltip" style="display:none;">
        Tap to place, then tap and hold to move
    </div>
</body>
</html>
