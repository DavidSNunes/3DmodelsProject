<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Model Viewer</title>
    <style>
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            overflow: hidden; 
        }
        #ar-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
        }
        #ar-button {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
        .error-message {
            color: red;
            font-size: 18px;
            font-weight: bold;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <!-- AR Container -->
    <div id="ar-container">
        <!-- UI Container -->
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <a id="product-link" href="#" target="_blank">View Product</a>
        </div>

        <!-- AR Button -->
        <button id="ar-button">Start AR</button>

        <!-- Error Message -->
        <p id="errorMessage" class="error-message" style="display: none;">Model not found.</p>
    </div>

    <!-- Load webxr.js -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
