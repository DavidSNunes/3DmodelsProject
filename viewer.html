<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer</title>
    <style>
        body { 
            text-align: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f5f5f5;
        }
        h2 {
            margin-bottom: 20px;
        }
        #ar-container {
            width: 80vw;
            max-width: 1000px;
            height: 60vh;
            max-height: 600px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        .error-message {
            color: red;
            font-size: 18px;
            font-weight: bold;
        }
        .ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }
        .ui-container a {
            color: #4CAF50;
            text-decoration: none;
        }
        #ar-button {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            z-index: 1000;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/build/three.min.js"></script>
    <!-- Load GLTFLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.146/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <h2>View Model in AR</h2>

    <!-- AR Container -->
    <div id="ar-container">
        <!-- UI Container -->
        <div class="ui-container">
            <h2 id="product-name">Loading...</h2>
            <p id="product-desc">Please wait while we load your model.</p>
            <a id="product-link" href="#" target="_blank">View Product</a>
        </div>

        <!-- AR Button -->
        <button id="ar-button">Start AR</button>
    </div>

    <!-- Error Message -->
    <p id="errorMessage" class="error-message" style="display: none;">Model not found.</p>

    <!-- Load webxr.js -->
    <script type="module" src="/webxr.js"></script>
</body>
</html>
