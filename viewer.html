<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Model Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer"></script>
    <style>
        body { 
            text-align: center; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background-color: #f5f5f5;
        }
        h2 {
            margin-bottom: 20px;
        }
        model-viewer {
            width: 80vw;
            max-width: 1000px;
            height: 60vh;
            max-height: 600px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .error-message {
            color: red;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>View Model in AR</h2>

    <model-viewer id="modelViewer"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate>
    </model-viewer>

    <p id="errorMessage" class="error-message" style="display: none;">Model not found.</p>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const modelFile = urlParams.get("file");

            if (modelFile) {
                const modelViewer = document.getElementById("modelViewer");
                const modelUrl = `https://3dmodelsproject.pages.dev/models/${modelFile}`;
                
                // Preload the model to check if it exists
                fetch(modelUrl, { method: "HEAD" })
                    .then(response => {
                        if (response.ok) {
                            modelViewer.setAttribute("src", modelUrl);
                        } else {
                            showError();
                        }
                    })
                    .catch(() => showError());
            } else {
                showError();
            }

            function showError() {
                document.getElementById("errorMessage").style.display = "block";
            }
        });
    </script>
</body>
</html>
