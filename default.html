<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beer Animation</title>
    <style>
        body {
            background-color: #fffaea;
        }

        .contain {
            height: 400px;
            width: 400px;
            left: 50%;
            top: 50%;
            position: absolute;
            transform: translateX(-50%) translateY(-50%);
        }

        .contain svg {
            vertical-align: top;
            width: 100%;
        }

        .beer {
            animation-name: empty;
            animation-fill-mode: forwards;
            animation-duration: 4s;
            animation-timing-function: linear;
            fill: #F9CF68;
        }

        @keyframes empty {
            0% {
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
            }
            30% {
                clip-path: polygon(0 16%, 100% 12%, 100% 100%, 0% 100%);
            }
            50% {
                clip-path: polygon(0 40%, 100% 44%, 100% 100%, 0% 100%);
            }
            70% {
                clip-path: polygon(0 69%, 100% 66%, 100% 100%, 0% 100%);
            }
            100% {
                clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0% 100%);
            }
        }
    </style>
</head>
<body>
    <div class="contain">
        <svg viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="200" fill="transparent" stroke="black" stroke-width="3"/>
            <rect class="beer" width="100" height="200"/>
        </svg>
    </div>
</body>
</html>
